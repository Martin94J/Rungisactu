name: Veille quotidienne
on:
  schedule:
    - cron: "0 5 * * *"   # 6h ou 7h à Paris
  workflow_dispatch:
permissions:
  contents: write
concurrency: veille
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/veille.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit des données
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Veille $(date -u +%F)" && git push)
